name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every C++ dependency, bromath included, is a submodule under third_party/,
# so a recursive checkout covers those. The test matrix also checks bromath
# out beside the repo from main, the layout bromesh is developed in (../bromath
# wins over the submodule), so a breaking change landing in bromath fails
# here; the `submodule` job builds without it, from the pinned submodule.
# bronze — the JavaScript runtime bromesh_api binds — has no submodule and
# resolves from ../bronze only, so every job checks this repo out under
# bromesh/ and lays bronze and brass beside it with bronze's
# checkout-toolchain action:
#
#     $GITHUB_WORKSPACE/
#       bromesh/    <- this repo, with submodules
#       bromath/    <- test matrix only
#       bronze/
#       brass/      <- bronze's code generator; bronze add_subdirectory()s it
#
# Both compile inside this build tree with the job's own compiler and CRT —
# the api is bound across bronze's C++ embed boundary, so a prebuilt bronze
# would be an unverifiable ABI hazard. That is what makes test_mesh_api the
# check that the library works the way bro uses it.
#
# Release, not Debug: meshoptimizer's Debug assertions fire during the mesh
# tests and, on Windows, surface as a modal abort() dialog that hangs the runner
# until it times out. Release sidesteps that and is the configuration the tests
# are tuned for. (The coverage job below runs Debug, but only on Linux, where
# the abort is a clean exit rather than a blocking dialog — and it filters those
# vendored libraries out anyway.)
#
# Default CMake generator (no -G): --parallel bounds the job count on its own.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-24.04, cc: gcc,   cxx: g++ }
          - { name: linux-clang,  os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-2022 }
          - { name: macos-arm64,  os: macos-15 }
    steps:
      - uses: actions/checkout@v7
        with:
          path: bromesh
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: wlejon/bromath
          path: bromath

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S bromesh -B build -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # ── Submodule fallback ────────────────────────────────────────────────────
  #
  # No sibling checkouts: bromath comes from the third_party/ submodule at the
  # commit this repo pins, as it does for a fresh `git clone --recursive`.
  # bronze and brass are the documented exception (no submodule; the api has
  # to compile against the bronze of the program that loads it) and are laid
  # out beside the repo as in the other jobs. The configure step checks
  # bromath really took the submodule path.
  submodule:
    name: Submodule fallback · ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: bromesh
          submodules: recursive

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Configure
        shell: bash
        run: |
          test ! -e bromath
          cmake -S bromesh -B build -DCMAKE_BUILD_TYPE=Release | tee configure.log
          grep -q "bromesh: bromath from .*third_party/bromath (submodule)" configure.log

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Debug + --coverage on Linux only. --filter scopes the numbers to bromesh's
  # own code (include/bromesh/ + src/); the vendored submodules and the tests
  # are excluded. --gcov-ignore-errors=no_working_dir_found tolerates the
  # generated/vendored TUs whose sources gcovr cannot resolve.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: bromesh
          submodules: recursive

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install gcovr
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcovr

      - name: Configure (instrumented)
        run: |
          cmake -S bromesh -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # pipefail: piping gcovr into tee otherwise hands the step tee's exit
      # status, so a gcovr crash produces no report and the job still goes green.
      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'bromesh/include/bromesh/' --filter 'bromesh/src/' \
            --exclude-unreachable-branches \
            --gcov-ignore-errors=no_working_dir_found \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `include/bromesh/` + `src/`'
            echo
            echo 'The vendored submodules and the tests are filtered out.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
